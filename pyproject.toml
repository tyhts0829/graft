[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grafix"
version = "0.0.6"
description = "Line-based geometry toolkit with chained effects and real-time preview."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "numpy",
  "numba",
  "shapely>=2,<3",
  "pyclipper",
  "moderngl",
  "pyglet>=2.1,<3",
  "imgui>=2,<3",
  "fontTools",
  "PyOpenGL",
  "PyOpenGL_accelerate",
  "PyYAML",
  "mido",
  "python-rtmidi",
  "psutil",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["grafix*"]

[tool.setuptools.package-data]
grafix = [
  "py.typed",
  "resource/default_config.yaml",
  "resource/examples/*.py",
  "resource/regular_polyhedron/*.npz",
  "resource/font/Google_Sans/static/*.ttf",
  "resource/font/Google_Sans/OFL.txt",
  "resource/font/Google_Sans/README.txt",
  "resource/font/Noto_Sans_JP/static/*.ttf",
  "resource/font/Noto_Sans_JP/OFL.txt",
  "resource/font/Noto_Sans_JP/README.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: multiprocessing、subprocess、または実 resource lifecycle を使うテスト",
  "e2e: 公開 CLI/application を entrypoint から往復するテスト",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "typings"
check_untyped_defs = false
disallow_untyped_defs = false
